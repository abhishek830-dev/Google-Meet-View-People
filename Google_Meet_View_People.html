<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Meet View People</title>
  </head>

  <style>
    body {
      /* display: flex; */
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: rgb(28, 28, 28);
    }

    .First-Container {
      width: 300px;
      background-color: black;
      margin: 10px;
      padding: 10px;
      color: white;
      border-radius: 10px;
      overflow-y: scroll;
      scrollbar-width: none;
    }

    .Second-Container {
      background-color: rgb(33 33 33 / 91%);
      border-radius: 20px;
      padding: 10px;
      margin: 10px;
      overflow-y: scroll;
      scrollbar-width: none;
    }

    .header {
      display: flex;
      background-color: transparent;
      justify-content: space-between;
      align-items: center;
      padding: 10px 10px 15px 10px;
      border-bottom: 1px solid #444;
    }

    .header h3 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      color: white;
    }

    .header button {
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      padding: 0;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .header button:hover {
      color: #aaa;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin: 12px 10px;
    }

    .controls button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 20px;
      background-color: #1565a0;
      color: white;
      border: none;
      flex: 1;
      padding: 10px 12px;
      cursor: pointer;
      transition: background-color 0.2s;
      font-size: 13px;
      font-weight: 500;
    }

    .controls button:hover {
      background-color: #1976b8;
    }

    .hidden {
      display: none;
    }

    .h3 {
      margin: 0;
    }

    .participant {
      display: flex;
      align-items: center;
      padding: 12px 10px;
      /* border-bottom: 1px solid #444; */
      gap: 12px;
      transition: background-color 0.2s;
    }

    .participant:hover {
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
    }

    .participant:last-child {
      border-bottom: none;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 16px;
      flex-shrink: 0;
    }

    .participant-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .participant-name {
      color: white;
      font-size: 14px;
      font-weight: 500;
    }

    .participant-role {
      color: #aaa;
      font-size: 12px;
    }

    .participant-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mute-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      color: #aaa;
    }

    .menu-btn {
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
      font-size: 18px;
      padding: 0 4px;
      flex-shrink: 0;
      transition: color 0.2s;
    }

    .menu-btn:hover {
      color: white;
    }

    .search {
      width: 100%;
      margin: 10px 10px;
      display: flex;
      align-items: center;
      background-color: transparent;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #444;
      box-sizing: border-box;
    }

    .search input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      margin-left: 8px;
      padding: 6px 0;
      font-size: 14px;
    }

    .search input::placeholder {
      color: #666;
    }

    .icon {
      display: flex;
      align-items: center;
      color: #666;
    }

    section p {
      font-size: 11px;
      color: #aaa;
      margin: 15px 10px 5px 10px;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .Third-Container {
      min-height: 300px;
      padding: 10px 0;
      border-radius: 10px;
      margin: 20px 0;
      border: 1px solid #444;
    }

    .participants {
      min-height: 250px;
      border-radius: 10px;
    }

    .contributors {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 15px 10px 10px 10px;
      padding: 10px 5px;
      border-bottom: 1px solid #444;
      font-weight: 600;
      font-size: 14px;
      color: white;
    }

    .contributors span:last-child {
      background-color: rgba(255, 255, 255, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 13px;
    }
  </style>

  <body>
    <div class="First-Container">
      <div class="Second-Container">
        <div class="header">
          <h3>People</h3>
          <button>X</button>
        </div>

        <div class="controls">
          <button>
            <!-- Mute Icon -->
            <svg width="16" height="16" viewBox="0 0 24 24" fill="white">
              <path
                d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.06c1.48-.74 2.5-2.26 2.5-4.03zM19 12c0 2.5-1.5 4.68-3.66 5.74l1.42 1.42C19.24 17.9 21 15.15 21 12h-2zM4.27 3L3 4.27l5 5V12c0 1.38.56 2.63 1.46 3.54l-1.27 1.27C6.9 15.73 6 13.98 6 12H4c0 2.67 1.28 5.03 3.25 6.5L3 22l1.27 1.27 18-18L20.73 3 4.27 3z"
              />
            </svg>
            All muted
          </button>

          <button>
            <!-- Add People Icon -->
            <svg width="16" height="16" viewBox="0 0 24 24" fill="white">
              <path
                d="M15 12c2.21 0 4-1.79 4-4S17.21 4 15 4s-4 1.79-4 4 1.79 4 4 4zM6 10V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h10v-2c0-.73.19-1.41.52-2H15z"
              />
            </svg>
            Add people
          </button>
        </div>

        <div class="search">
          <span class="icon">
            <!-- SVG -->
            <svg width="16" height="16" viewBox="0 0 24 24" fill="white">
              <path
                d="M10 2a8 8 0 105.293 14.293l4.707 4.707 1.414-1.414-4.707-4.707A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"
              />
            </svg>
          </span>
          <input type="text" id="searchBox" placeholder="Search for people" />
        </div>

        <section>
          <p>IN THE MEETING</p>
        </section>

        <div class="Third-Container">
          <div class="contributors">
  <div class="left">
    <span>Contributors</span>
    <span id="count">0</span>
  </div>

  <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="white">
    <path d="M7 10l5 5 5-5H7z"/>
  </svg>
</div>

          <div class="participants" id="results">
            <!-- JS se populate hoga -->
          </div>
        </div>
      </div>
    </div>

    <script>
      const names = [
        "Vidhya Skill School(You)",
        "Abhishek Garg",
        "Almas Chamadiya",
        "ANKIT RAJPUT",
        "Ashitosh Vidhate",
        "Aviral Jain",
        "Ayush Gupta",
        "Deepanshu Garg",
        "Pinky Thawani",
        "Prakash",
        "Pranav Khare",
        "Rakshit Dalal",
        "Shivani Vishwakarma",
        "Shruti Prajapati",
        "vikas vanve",
      ];

      const searchBox = document.getElementById("searchBox");
      const results = document.getElementById("results");

      show(names);

      searchBox.addEventListener("input", () => {
        const value = searchBox.value.toLowerCase();

        const filtered = names.filter(
          (name) => name.toLowerCase().search(value) !== -1,
        );

        show(filtered);
      });

      function show(namesList) {
        results.innerHTML = "";

        document.getElementById("count").textContent = namesList.length;

        const colors = [
          "#16B6A0",
          "#00A67E",
          "#00A850",
          "#00A76D",
          "#16A37E",
          "#0D97A3",
          "#1B8DD9",
          "#8B5CF6",
          "#EC4899",
          "#F59E0B",
          "#10B981",
          "#06B6D4",
        ];

        function getInitials(name) {
          return name
            .split(" ")
            .map((word) => word[0])
            .join("")
            .toUpperCase()
            .slice(0, 2);
        }

        function getColor(name) {
          let hash = 0;
          for (let i = 0; i < name.length; i++) {
            hash = name.charCodeAt(i) + ((hash << 5) - hash);
          }
          return colors[Math.abs(hash) % colors.length];
        }

        namesList.forEach((name) => {
          const div = document.createElement("div");
          div.className = "participant";

          const initials = getInitials(name);
          const color = getColor(name);
          const isHost = name.includes("(You)");
          const displayName = name.replace("(You)", "").trim();

          div.innerHTML = `
            <div class="avatar" style="background-color: ${color}">
              ${initials}
            </div>
            <div class="participant-info">
              <div class="participant-name">${displayName}</div>
              ${isHost ? '<div class="participant-role">Meeting host</div>' : ""}
            </div>
            <div class="participant-actions">
              <svg class="mute-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.06c1.48-.74 2.5-2.26 2.5-4.03zM19 12c0 2.5-1.5 4.68-3.66 5.74l1.42 1.42C19.24 17.9 21 15.15 21 12h-2zM4.27 3L3 4.27l5 5V12c0 1.38.56 2.63 1.46 3.54l-1.27 1.27C6.9 15.73 6 13.98 6 12H4c0 2.67 1.28 5.03 3.25 6.5L3 22l1.27 1.27 18-18L20.73 3 4.27 3z"/>
              </svg>
              <button class="menu-btn">⋮</button>
            </div>
          `;

          results.appendChild(div);
        });
      }
    </script>
  </body>
</html>
